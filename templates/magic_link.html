{% extends 'marketing_base.html' %}
{% block title %}{{ _('auth.page.title_magic') }}{% endblock %}
{% block content %}
<section class="mq-auth-page">
  <div class="mq-auth-card">
    <p class="page-kicker">{{ _('auth.page.magic_eyebrow') }}</p>
    <h1>{{ _('auth.page.magic_title') }}</h1>
    <p class="mq-auth-lead">{{ _('auth.page.magic_lead') }}</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label" for="magic-email">{{ _('auth.page.email') }}</label>
        <input class="mq-input" id="magic-email" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.page.send_magic') }}</button>
    </form>
  </div>
</section>
{% endblock %}

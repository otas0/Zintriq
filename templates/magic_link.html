{% extends 'base.html' %}
{% block title %}Email sign-in link — MarketQR{% endblock %}
{% block content %}
<section class="mq-auth-page">
  <div class="mq-auth-card">
    <p class="mq-section-label">Passwordless sign-in</p>
    <h1>Email me a link</h1>
    <p class="mq-auth-lead">We'll send a one-time sign-in link that expires in 15 minutes.</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">Email address</label>
        <input class="mq-input" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">Send sign-in link</button>
    </form>
  </div>
</section>
{% endblock %}

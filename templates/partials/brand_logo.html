{# Zintriq wordmark — use variant="light" on light backgrounds, "dark" on dark. #}
{% set _variant = variant|default('light') %}
{% set _class = class|default('zintriq-logo') %}
{% set _src = 'brand/zintriq-dark.png' if _variant == 'dark' else 'brand/zintriq-light.png' %}
<img class="{{ _class }}"
     src="{{ url_for('static', filename=_src) }}?v=20260821d"
     alt="zintriq"
     width="{{ width|default(120) }}"
     height="{{ height|default(32) }}"
     decoding="async" />

{# Cloudflare Turnstile widget — shown only when TURNSTILE_SITE_KEY is set #}
{% if turnstile_site_key %}
<div class="{{ turnstile_wrap_class or 'mq-field mq-turnstile' }}">
  <div class="cf-turnstile"
       data-sitekey="{{ turnstile_site_key }}"
       data-theme="{{ turnstile_theme or 'light' }}"
       data-size="{{ turnstile_size or 'flexible' }}"></div>
</div>
{% if not turnstile_skip_script %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
{% endif %}

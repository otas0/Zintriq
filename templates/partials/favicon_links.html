<link rel="icon" id="mq-favicon" type="image/png" sizes="32x32" href="/safari-tab-icon-yellow.png?v=y1">
<link rel="shortcut icon" type="image/png" href="/safari-tab-icon-yellow.png?v=y1">
<link rel="apple-touch-icon" href="/safari-touch-icon-yellow.png?v=y1">
<link rel="apple-touch-icon-precomposed" href="/safari-touch-icon-yellow.png?v=y1">
<script>
(function () {
  var href = "/safari-tab-icon-yellow.png?v=y1&t=" + Date.now();
  document.querySelectorAll('link[rel*="icon"]').forEach(function (el) {
    if (el.id !== "mq-favicon") el.parentNode && el.parentNode.removeChild(el);
  });
  var link = document.getElementById("mq-favicon");
  if (!link) {
    link = document.createElement("link");
    link.id = "mq-favicon";
    link.rel = "icon";
    link.type = "image/png";
    document.head.appendChild(link);
  }
  link.sizes = "32x32";
  link.href = href;
})();
</script>

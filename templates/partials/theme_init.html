{# Theme initialization — runs before paint to prevent FOUC.
   Reads user preference from localStorage, falls back to system preference.
   Sets data-theme on <html>: "light", "dark", or "yellow". #}
<script>
(function() {
  var stored = localStorage.getItem('zintriq-theme');
  if (stored === 'light' || stored === 'dark' || stored === 'yellow') {
    document.documentElement.setAttribute('data-theme', stored);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!localStorage.getItem('zintriq-theme')) {
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    }
  });
})();
</script>

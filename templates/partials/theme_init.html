{# Cookie `theme` (also mq_theme). SSR sets data-theme only for light|dark. #}
<script>
(function() {
  document.documentElement.classList.add('js');
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  function pinTop() {
    if (window.location.hash) return;
    window.scrollTo(0, 0);
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  }
  pinTop();
  window.addEventListener('pageshow', pinTop);
  window.addEventListener('load', pinTop);
  document.addEventListener('mousedown', function (ev) {
    var a = ev.target && ev.target.closest && ev.target.closest('a[href]');
    if (!a) return;
    try { a.focus({ preventScroll: true }); } catch (err) {}
  }, true);
  document.addEventListener('click', function (ev) {
    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    var a = ev.target && ev.target.closest && ev.target.closest('a[href]');
    if (!a || a.hasAttribute('download') || (a.target && a.target !== '' && a.target !== '_self')) return;
    var raw = a.getAttribute('href') || '';
    if (!raw || raw.charAt(0) === '#' || raw.indexOf('mailto:') === 0 || raw.indexOf('javascript:') === 0) return;
    var url;
    try { url = new URL(a.href, window.location.href); } catch (err) { return; }
    if (url.origin !== window.location.origin || url.hash) return;
    try { sessionStorage.setItem('zintriq_scroll_top', '1'); } catch (err2) {}
  }, true);
  try {
    if (sessionStorage.getItem('zintriq_scroll_top') === '1') {
      sessionStorage.removeItem('zintriq_scroll_top');
      pinTop();
      document.addEventListener('DOMContentLoaded', pinTop);
      var n = 0;
      var tick = setInterval(function () {
        pinTop();
        n += 1;
        if (n > 12) clearInterval(tick);
      }, 16);
    }
  } catch (err3) {}
  function readCookie(name) {
    var parts = ('; ' + document.cookie).split('; ' + name + '=');
    if (parts.length < 2) return '';
    return decodeURIComponent(parts.pop().split(';').shift() || '');
  }
  function writeCookie(name, value) {
    document.cookie = name + '=' + encodeURIComponent(value) + '; Path=/; Max-Age=31536000; SameSite=Lax';
  }
  function writePref(pref) {
    writeCookie('theme', pref);
    writeCookie('mq_theme', pref);
  }
  function systemDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyPref(pref) {
    document.documentElement.setAttribute('data-theme-pref', pref);
    if (pref === 'light' || pref === 'dark') {
      document.documentElement.setAttribute('data-theme', pref);
      writeCookie('mq_theme_resolved', pref);
    } else {
      document.documentElement.removeAttribute('data-theme');
      writeCookie('mq_theme_resolved', systemDark() ? 'dark' : 'light');
    }
  }
  var pref = readCookie('theme') || readCookie('mq_theme') || document.documentElement.getAttribute('data-theme-pref') || 'system';
  if (pref === 'yellow') pref = 'light';
  if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system';
  applyPref(pref);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      var current = readCookie('theme') || readCookie('mq_theme') || 'system';
      if (current === 'system') applyPref('system');
    });
  }
  window.__zintriqSetTheme = function(next) {
    if (next !== 'light' && next !== 'dark' && next !== 'system') next = 'system';
    writePref(next);
    applyPref(next);
    document.querySelectorAll('[data-theme-set]').forEach(function(btn) {
      btn.setAttribute('aria-pressed', btn.getAttribute('data-theme-set') === next ? 'true' : 'false');
    });
    document.querySelectorAll('[data-theme-cycle]').forEach(function(btn) {
      var key = 'data-label-' + next;
      var label = btn.getAttribute(key);
      if (label) btn.setAttribute('aria-label', label);
    });
  };
})();
</script>

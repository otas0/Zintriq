{% if region_mismatch %}
<aside
  class="mq-region-hint"
  id="mq-region-hint"
  role="region"
  aria-labelledby="mq-region-hint-title"
  data-dismiss-cookie="mq_region_hint_dismiss"
  data-dismiss-key="{{ region_mismatch.dismiss_key }}"
>
  <p class="page-kicker">{{ _('region.footer_link') }}</p>
  <p class="mq-region-hint__place" id="mq-region-hint-title" dir="auto">{{ region_mismatch.detected_display }}</p>
  <p class="mq-region-hint__body">{{ _('region.mismatch.body') }}</p>
  <p class="mq-region-hint__actions">
    <a class="btn-primary" href="{{ region_mismatch.go_url }}">{{ _('region.mismatch.go') }}</a>
    <button type="button" class="btn-ghost" id="mq-region-hint-stay">{{ _('region.mismatch.stay') }}</button>
  </p>
</aside>
{% endif %}

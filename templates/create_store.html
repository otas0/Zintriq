{% extends 'os_base.html' %}
{% set os_nav = 'create' %}
{% block title %}{{ _('owner.create_store_title') }} — Zintriq{% endblock %}
{% block os_header %}
<h1 class="os-page-title">{{ _('owner.create_store') }}</h1>
<p class="os-page-subtitle">{{ _('owner.create_store_lead') }}</p>
{% endblock %}
{% block os_content %}
<form class="os-card os-card-padded os-form" style="max-width:560px" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="os-field"><label class="os-label">{{ _('owner.business_name_required') }}</label><input class="os-input" name="name" required placeholder="{{ _('owner.business_name_placeholder') }}"></div>
    <div class="os-field"><label class="os-label">{{ _('owner.your_name') }}</label><input class="os-input" name="owner_name" placeholder="{{ _('owner.name_placeholder') }}"></div>
    <div class="os-field"><label class="os-label">{{ _('owner.customer_contact') }}</label><input class="os-input" name="contact" placeholder="{{ _('owner.contact_placeholder') }}"></div>
    <div class="os-field"><label class="os-label">{{ _('owner.address') }}</label><textarea class="os-textarea" name="address" placeholder="{{ _('common.optional') }}"></textarea></div>
    <div class="os-field"><label class="os-label">{{ _('owner.business_hours') }}</label><textarea class="os-textarea" name="business_hours" placeholder="{{ _('common.optional') }}"></textarea></div>
    <div class="os-field"><label class="os-label">{{ _('owner.about_business') }}</label><textarea class="os-textarea" name="description" placeholder="{{ _('owner.about_placeholder') }}"></textarea></div>
    <button class="os-btn os-btn-primary" type="submit">{{ _('owner.create_store') }}</button>
</form>
{% endblock %}

{# Compact scan steps — fills hub pages when content is sparse #}
<section class="ch-scan-steps material-module" aria-label="How in-store shopping works">
  <h2 class="ch-scan-steps__title">How it works</h2>
  <ol class="ch-scan-steps__list">
    <li class="ch-scan-steps__item">
      <span class="ch-scan-steps__num">1</span>
      <span class="ch-scan-steps__text">Scan the QR code at the shop counter or on a product tag</span>
    </li>
    <li class="ch-scan-steps__item">
      <span class="ch-scan-steps__num">2</span>
      <span class="ch-scan-steps__text">Browse the menu and add items to your cart on your phone</span>
    </li>
    <li class="ch-scan-steps__item">
      <span class="ch-scan-steps__num">3</span>
      <span class="ch-scan-steps__text">Pay in store or check out online — the shop saves here under Places</span>
    </li>
  </ol>
</section>

{# Compact scan steps — fills hub pages when content is sparse #}
<section class="ch-scan-steps material-module" aria-label="{{ _('how.aria') }}">
  <h2 class="ch-scan-steps__title">{{ _('how.title') }}</h2>
  <ol class="ch-scan-steps__list">
    <li class="ch-scan-steps__item">
      <span class="ch-scan-steps__num">1</span>
      <span class="ch-scan-steps__text">{{ _('how.step1') }}</span>
    </li>
    <li class="ch-scan-steps__item">
      <span class="ch-scan-steps__num">2</span>
      <span class="ch-scan-steps__text">{{ _('how.step2') }}</span>
    </li>
    <li class="ch-scan-steps__item">
      <span class="ch-scan-steps__num">3</span>
      <span class="ch-scan-steps__text">{{ _('how.step3') }}</span>
    </li>
  </ol>
</section>

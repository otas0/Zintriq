{% if can_switch_to_business|default(false) %}
<form class="mq-mode-switch material-module" method="post" action="{{ url_for('customer_switch_to_business') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mq-mode-switch__copy">
    <span class="mq-mode-switch__label">Personal mode</span>
    <span class="mq-mode-switch__hint">Same account — switch to manage your business</span>
  </div>
  <button type="submit" class="mq-mode-switch__btn">Business</button>
</form>
{% endif %}

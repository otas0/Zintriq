{# Item group navigation — only rendered when show_group_nav is true #}
{% if show_group_nav %}
<section class="mq-chip-rail mq-chip-rail--sticky" id="item-group-nav">
  <div class="mq-public-container">
    <div class="mq-chip-rail__inner">
      {% for group in group_nav %}
      <a class="mq-chip{% if active_group == group.id %} is-active{% endif %}"
         href="{{ url_for('store_preview' if preview_mode else 'storefront', slug=store.slug, group=group.id if group.id != 'default' else 'default') }}"
         data-group-id="{{ group.id }}">{{ group.name }}</a>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}

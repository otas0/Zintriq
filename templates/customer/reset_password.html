{% extends 'customer_base.html' %}
{% block title %}New password — Zintriq{% endblock %}
{% block content %}
<section class="mq-auth-page guest-auth-page">
  <div class="mq-auth-card">
    <h1>Choose a new password</h1>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">New password</label>
        <input class="mq-input" name="password" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <div class="mq-field">
        <label class="mq-label">Confirm password</label>
        <input class="mq-input" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">Update password</button>
    </form>
  </div>
</section>
{% endblock %}

{% extends 'customer_base.html' %}
{% block title %}{{ _('auth.page.title_reset') }}{% endblock %}
{% block content %}
<section class="mq-auth-page guest-auth-page">
  <div class="mq-auth-card">
    <h1>{{ _('auth.page.reset_title') }}</h1>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">{{ _('auth.page.new_password') }}</label>
        <input class="mq-input" name="password" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <div class="mq-field">
        <label class="mq-label">{{ _('auth.page.confirm_password_plain') }}</label>
        <input class="mq-input" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.update_password') }}</button>
    </form>
  </div>
</section>
{% endblock %}

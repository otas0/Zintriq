{% extends 'customer_base.html' %}
{% block title %}Reset password — Zintriq{% endblock %}
{% block content %}
<section class="mq-auth-page guest-auth-page">
  <div class="mq-auth-card">
    <h1>Reset password</h1>
    <p class="mq-auth-lead">We'll email a link to reset your shopper account password.</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">Email address</label>
        <input class="mq-input" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">Send reset link</button>
    </form>
    <p class="mq-auth-links"><a href="{{ url_for('customer_login') }}">Back to sign in</a></p>
  </div>
</section>
{% endblock %}

{# Guests: every Home visit. Members: first visit only (customer-onboarding.js). #}
<div class="mq-onboard" id="mq-onboard" hidden aria-hidden="true"
     data-onboarding-mode="{{ onboarding_mode|default('guest') }}"
     data-onboarding-open="{{ '1' if onboarding_open|default(true) else '0' }}"
     {% if current_customer %}data-customer-id="{{ current_customer.id }}"{% endif %}>
  <div class="mq-onboard__backdrop" data-onboard-close tabindex="-1"></div>
  <div class="mq-onboard__panel material-module" role="dialog" aria-modal="true" aria-labelledby="mq-onboard-title">
    <button type="button" class="mq-onboard__close" data-onboard-close aria-label="Close">×</button>
    <p class="mq-onboard__eyebrow">Welcome</p>
    <h2 class="mq-onboard__title" id="mq-onboard-title">How it works</h2>
    <p class="mq-onboard__lead">Shop in store on mobile devices.</p>
    {% set how_it_works_steps = onboarding_steps %}
    {% include 'customer/_how_it_works_steps.html' %}
    <div class="mq-onboard__actions">
      <button type="button" class="mq-btn mq-btn-primary mq-onboard__cta" data-onboard-close>Got it</button>
      <a class="mq-onboard__help-link" href="{{ url_for('customer_help_home') }}">Browse all help topics</a>
    </div>
  </div>
</div>

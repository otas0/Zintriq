{% extends 'customer_base.html' %}
{% block title %}{{ _('auth.page.title_magic') }}{% endblock %}
{% block content %}
<section class="mq-auth-page guest-auth-page">
  <div class="mq-auth-card">
    <h1>{{ _('auth.page.magic_link') }}</h1>
    <p class="mq-auth-lead">{{ _('auth.magic_lead_short') }}</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">{{ _('auth.page.email') }}</label>
        <input class="mq-input" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.send_link') }}</button>
    </form>
    <p class="mq-auth-links"><a href="{{ work_url(current_work, 'account/login') }}">{{ _('auth.back_to_signin') }}</a></p>
  </div>
</section>
{% endblock %}

{% extends 'customer_base.html' %}
{% block title %}{{ _('account.setup_title') }} — Zintriq{% endblock %}
{% block content %}
<section class="ig-profile ig-profile--setup">
  <div class="ig-profile__hero">
    <div class="ig-profile__avatar" aria-hidden="true"></div>
    <h1 class="ig-profile__name">{{ _('account.setup_title') }}</h1>
    <p class="ig-profile__bio">{{ _('account.setup_lead') }}</p>
  </div>

  <form class="guest-account__form material-module" id="account-setup-form" method="post" action="{{ work_url(current_work, 'account/onboarding/complete') }}" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mq-field">
      <label class="mq-label">{{ _('account.username') }}</label>
      <input class="mq-input" name="username" id="setup-username" value="{{ suggested_username }}" required pattern="[a-z][a-z0-9_.]{2,29}">
      <p class="ig-auth__hint" id="setup-username-hint"></p>
    </div>
    <div class="mq-field">
      <label class="mq-label">{{ _('account.display_name') }}</label>
      <input class="mq-input" name="display_name" autocomplete="name" placeholder="{{ _('auth.optional') }}">
    </div>
    <div class="mq-field">
      <label class="mq-label">{{ _('account.photo') }}</label>
      <input class="mq-input" name="avatar" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    </div>
    <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.save_continue') }}</button>
  </form>
</section>
{% endblock %}

{% block customer_scripts %}
<script type="module">
const input = document.getElementById("setup-username");
const hint = document.getElementById("setup-username-hint");
const msgAvailable = {{ _('account.username_available', username='__U__')|tojson }};
const msgTaken = {{ _('account.username_taken')|tojson }};
let timer;
input?.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { hint.textContent = ""; return; }
    const res = await fetch(`/account/username/check?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    hint.textContent = data.available ? msgAvailable.replace("__U__", data.username) : (data.error || msgTaken);
    hint.className = "ig-auth__hint " + (data.available ? "ig-auth__hint--ok" : "ig-auth__hint--bad");
  }, 350);
});
</script>
{% endblock %}

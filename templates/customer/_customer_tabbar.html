<div class="ch-tabbar-wrap">
  <nav class="ch-tabbar" aria-label="{{ _('nav.customer_nav') }}">
    <a class="ch-tabbar__item{% if customer_nav_tab == 'home' %} is-active{% endif %}" href="{{ url_for('index') }}">
      <span class="ch-tabbar__label">{{ _('nav.home') }}</span>
    </a>
    <a class="ch-tabbar__item{% if customer_nav_tab == 'account' %} is-active{% endif %}"
       href="{{ work_url(current_work, 'account') }}">
      <span class="ch-tabbar__label">{{ _('nav.account') }}</span>
    </a>
  </nav>
</div>

{% extends 'marketing_base.html' %}
{% block title %}{{ _('auth.forgot.title') }} — Zintriq{% endblock %}
{% block content %}
<section class="mq-auth-page">
  <div class="mq-auth-card">
    <p class="page-kicker">{{ _('auth.login.forgot') }}</p>
    <h1>{{ _('auth.forgot.title') }}</h1>
    <p class="mq-auth-lead">{{ _('auth.forgot.by_phone') }}</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label" for="forgot-phone">{{ _('auth.phone.label') }}</label>
        <input class="mq-input" id="forgot-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.phone.send_code') }}</button>
    </form>
    <form class="mq-auth-form" method="post" action="{{ url_for('forgot_password_verify') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label" for="forgot-verify-phone">{{ _('auth.phone.label') }}</label>
        <input class="mq-input" id="forgot-verify-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
      </div>
      <div class="mq-field">
        <label class="mq-label" for="forgot-code">{{ _('auth.phone.code_label') }}</label>
        <input class="mq-input" id="forgot-code" name="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" pattern="[0-9]*">
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.forgot.done') }}</button>
    </form>
    <p class="mq-auth-lead">{{ _('auth.forgot.by_email') }}</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label" for="forgot-email">{{ _('auth.email') }}</label>
        <input class="mq-input" id="forgot-email" name="email" type="email" autocomplete="email">
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.forgot.by_email') }}</button>
    </form>
  </div>
</section>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Reset password — MarketQR{% endblock %}
{% block content %}
<section class="mq-auth-page">
  <div class="mq-auth-card">
    <p class="mq-section-label">Account recovery</p>
    <h1>Reset your password</h1>
    <p class="mq-auth-lead">Enter your email and we'll send a one-time reset link.</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">Email address</label>
        <input class="mq-input" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">Send reset link</button>
    </form>
  </div>
</section>
{% endblock %}

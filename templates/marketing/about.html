{% extends 'marketing_base.html' %}
{% block title %}{{ _('about.title') }} — Zintriq{% endblock %}
{% block content %}
<article class="page site-page">
  <section class="page-hero">
    <div>
      <p class="page-kicker">{{ _('about.kicker') }}</p>
      <h1>{{ _('about.title') }}</h1>
      <p class="page-lead">{{ _('about.body') }}</p>
      {% if _('about.ops') %}
      <p class="page-note">{{ _('about.ops') }}</p>
      {% endif %}
    </div>
  </section>
  <section class="page-end page-end--paper site-end" data-reveal>
    <p class="page-actions"><a class="btn-primary" href="{{ murl('/contact') }}">{{ _('about.cta') }}</a></p>
  </section>
</article>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Accept invitation — Business OS{% endblock %}
{% block content %}
<section class="mq-auth-page">
  <div class="mq-auth-card">
    <p class="mq-section-label">Team invitation</p>
    <h1>Join workspace</h1>
    <p class="mq-auth-lead">You've been invited to collaborate on a workspace.</p>
    <button class="mq-btn mq-btn-primary" type="button" id="accept-invite-btn" data-token="{{ token }}">Accept invitation</button>
    <p id="accept-invite-msg" class="mq-auth-error" hidden></p>
    <p class="mq-auth-links"><a href="/app/team">Go to Team</a></p>
  </div>
</section>
<script>
document.getElementById("accept-invite-btn")?.addEventListener("click", async () => {
  const token = document.getElementById("accept-invite-btn")?.dataset.token || "";
  const msg = document.getElementById("accept-invite-msg");
  try {
    const res = await fetch("/api/team/invitations/accept", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed");
    window.location.href = "/app/team";
  } catch (e) {
    if (msg) { msg.textContent = e.message || "Could not accept invitation"; msg.hidden = false; }
  }
});
</script>
{% endblock %}

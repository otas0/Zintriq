{% extends 'marketing_base.html' %}
{% block title %}{{ _('auth.page.title_reset') }}{% endblock %}
{% block content %}
<section class="mq-auth-page">
  <div class="mq-auth-card">
    <h1>{{ _('auth.page.reset_title') }}</h1>
    <form class="mq-auth-form" method="post" data-password-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">{{ _('auth.password.label') }}</label>
        <input class="mq-input" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required data-password-input>
        <p class="mq-auth-lead" data-password-hint aria-live="polite"></p>
      </div>
      <div class="mq-field">
        <label class="mq-label">{{ _('auth.page.confirm_password_plain') }}</label>
        <input class="mq-input" name="confirm_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
      </div>
      <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.page.save_password') }}</button>
    </form>
  </div>
</section>
<script type="module" src="{{ url_for('static', filename='password-strength.js') }}"></script>
{% endblock %}

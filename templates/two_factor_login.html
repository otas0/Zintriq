{% extends 'base.html' %}
{% block title %}Verify sign in — Zintriq{% endblock %}
{% block content %}
<section class="mq-auth-page">
  <div class="mq-auth-card">
    <p class="mq-section-label">Security check</p>
    <h1>Verify it's you</h1>
    <p class="mq-auth-lead">Enter the 6-digit code from your authenticator app.</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">Authentication code</label>
        <input class="mq-input" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      </div>
      <p class="mq-auth-lead mq-auth-lead--compact">Your sign-in preference from the previous step still applies.</p>
      <button class="mq-btn mq-btn-primary" type="submit">Verify and sign in</button>
    </form>
  </div>
</section>
{% endblock %}

{% extends 'marketing_base.html' %}
{% block title %}{{ _('auth.page.title_twofa') }}{% endblock %}
{% block content %}
<section class="mq-auth-page">
  <div class="mq-auth-card">
    <p class="mq-section-label">{{ _('auth.page.twofa_eyebrow') }}</p>
    <h1>{{ _('auth.page.twofa_title') }}</h1>
    <p class="mq-auth-lead">{{ _('auth.page.twofa_lead') }}</p>
    <form class="mq-auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mq-field">
        <label class="mq-label">{{ _('auth.page.twofa_code') }}</label>
        <input class="mq-input" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      </div>
      <p class="mq-auth-lead mq-auth-lead--compact">{{ _('auth.page.twofa_note') }}</p>
      <button class="mq-btn mq-btn-primary" type="submit">{{ _('auth.page.twofa_submit') }}</button>
    </form>
  </div>
</section>
{% endblock %}

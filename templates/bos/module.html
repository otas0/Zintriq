{% extends 'bos/shell.html' %}
{% block bos_content %}
<div class="bos-module-root" id="bos-module-root"
     data-module="{{ module_id }}"
     data-csrf="{{ csrf_token() }}">
  <div class="bos-module-loading" id="bos-module-loading" aria-busy="true" aria-label="Loading module">
    <div class="bos-skeleton bos-skeleton--card"></div>
    <div class="bos-skeleton bos-skeleton--row"></div>
    <div class="bos-skeleton bos-skeleton--row"></div>
  </div>
  <noscript>
    <div class="bos-empty"><p class="bos-empty__title">JavaScript required</p><p class="bos-empty__text">Enable JavaScript to use Business OS modules.</p></div>
  </noscript>
</div>
<script>
  window.BOS_MODULE = {{ module_id | tojson }};
</script>
{% endblock %}

<div class="material-sheet workspace workspace--list-only" id="workspace"
     data-csrf="{{ csrf_token() }}"
     data-mode="{{ workspace_mode }}"
     data-focus-group="{{ focus_group_id|default('') }}">
  <main class="workspace-main workspace-main--full">
    <header class="material-panel workspace-toolbar">
      <div class="workspace-toolbar__search">
        <input type="search" id="workspace-search" class="os-input" placeholder="{{ _('owner.search_stores') }}" autocomplete="off">
        <div class="workspace-toolbar__filters">
          <nav class="workspace-status-filters" id="workspace-status-filters" aria-label="{{ _('owner.store_status') }}">
            <button type="button" class="workspace-status-chip active" data-view="all">{{ _('owner.all') }}</button>
            <button type="button" class="workspace-status-chip" data-view="active">{{ _('bos.active') }}</button>
            <button type="button" class="workspace-status-chip" data-view="archived">{{ _('owner.archived') }}</button>
            <button type="button" class="workspace-status-chip workspace-status-chip--muted" data-view="ungrouped">{{ _('owner.ungrouped') }}</button>
            <button type="button" class="workspace-status-chip workspace-status-chip--muted" data-view="recent">{{ _('bos.recent') }}</button>
          </nav>
          <a class="workspace-organize-link" href="{{ url_for('store_groups_manage') }}">{{ _('bos.groups_labels') }}</a>
        </div>
      </div>
      <div class="toolbar-actions">
        <label class="checkbox-label"><input type="checkbox" id="workspace-select-all"> {{ _('owner.select_all') }}</label>
      </div>
    </header>

    <div class="workspace-active-filters" id="active-filters"></div>
    <div class="workspace-list" id="store-list"></div>
    <div class="workspace-empty hidden" id="workspace-empty">
      <p>{{ _('owner.no_stores_match') }}</p>
      <a class="button" href="{{ url_for('create_store') }}">{{ _('owner.create_store') }} <span>+</span></a>
    </div>
  </main>
</div>

<div class="material-panel workspace-action-bar hidden" id="action-bar">
  <span class="action-bar-count" id="action-bar-count">{{ _('bos.selected_n', n=0) }}</span>
  <div class="action-bar-primary">
    <a class="outline small action-bar-manage hidden" id="action-bar-manage" href="#">{{ _('bos.manage') }}</a>
    <button type="button" class="outline small" data-batch="archive">{{ _('owner.archive') }}</button>
    <div class="action-bar-more">
      <button type="button" class="outline small" id="action-bar-more-btn" aria-expanded="false" aria-haspopup="menu">{{ _('owner.more') }}</button>
      <div class="action-bar-more-menu hidden" id="action-bar-more-menu" role="menu">
        <button type="button" role="menuitem" data-batch="activate">{{ _('owner.activate') }}</button>
        <button type="button" role="menuitem" data-popover="move-group">{{ _('owner.move_to_group') }}</button>
        <button type="button" role="menuitem" data-popover="labels">{{ _('bos.labels') }}</button>
        <button type="button" role="menuitem" data-batch="duplicate">{{ _('bos.duplicate') }}</button>
        <button type="button" role="menuitem" data-batch="export">{{ _('owner.export') }}</button>
        <button type="button" role="menuitem action-bar-more-danger" data-batch="delete">{{ _('bos.delete') }}</button>
      </div>
    </div>
  </div>
  <button type="button" class="action-bar-clear" id="action-bar-clear" aria-label="{{ _('owner.clear_selection') }}">×</button>
</div>

<aside class="material-overlay workspace-drawer hidden" id="store-drawer" aria-hidden="true">
  <div class="drawer-header">
    <h2 id="drawer-title">{{ _('owner.store_details') }}</h2>
    <button type="button" class="drawer-close" id="drawer-close" aria-label="{{ _('bos.close') }}">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="material-overlay workspace-popover hidden" id="workspace-popover">
  <div class="popover-head" id="popover-title"></div>
  <div class="popover-body" id="popover-body"></div>
</div>

<div class="workspace-context-menu hidden" id="context-menu"></div>
<div class="material-feedback workspace-toast hidden" id="workspace-toast"></div>

<script>
  window.WORKSPACE_BOOT = {{ workspace | tojson }};
</script>
<script src="{{ url_for('static', filename='workspace.js') }}"></script>

<div class="material-sheet workspace workspace--list-only" id="workspace"
     data-csrf="{{ csrf_token() }}"
     data-mode="{{ workspace_mode }}"
     data-focus-group="{{ focus_group_id|default('') }}">
  <main class="workspace-main workspace-main--full">
    <header class="material-panel workspace-toolbar">
      <div class="workspace-toolbar__search">
        <input type="search" id="workspace-search" class="os-input" placeholder="Search stores…" autocomplete="off">
        <div class="workspace-toolbar__filters">
          <nav class="workspace-status-filters" id="workspace-status-filters" aria-label="Store status">
            <button type="button" class="workspace-status-chip active" data-view="all">All</button>
            <button type="button" class="workspace-status-chip" data-view="active">Active</button>
            <button type="button" class="workspace-status-chip" data-view="archived">Archived</button>
            <button type="button" class="workspace-status-chip workspace-status-chip--muted" data-view="ungrouped">Ungrouped</button>
            <button type="button" class="workspace-status-chip workspace-status-chip--muted" data-view="recent">Recent</button>
          </nav>
          <a class="workspace-organize-link" href="{{ url_for('store_groups_manage') }}">Groups &amp; labels</a>
        </div>
      </div>
      <div class="toolbar-actions">
        <label class="checkbox-label"><input type="checkbox" id="workspace-select-all"> Select all</label>
      </div>
    </header>

    <div class="workspace-active-filters" id="active-filters"></div>
    <div class="workspace-list" id="store-list"></div>
    <div class="workspace-empty hidden" id="workspace-empty">
      <p>No stores match your current view.</p>
      <a class="button" href="{{ url_for('create_store') }}">Create store <span>+</span></a>
    </div>
  </main>
</div>

<div class="material-panel workspace-action-bar hidden" id="action-bar">
  <span class="action-bar-count" id="action-bar-count">0 selected</span>
  <div class="action-bar-primary">
    <a class="outline small action-bar-manage hidden" id="action-bar-manage" href="#">Manage</a>
    <button type="button" class="outline small" data-batch="archive">Archive</button>
    <div class="action-bar-more">
      <button type="button" class="outline small" id="action-bar-more-btn" aria-expanded="false" aria-haspopup="menu">More ▾</button>
      <div class="action-bar-more-menu hidden" id="action-bar-more-menu" role="menu">
        <button type="button" role="menuitem" data-batch="activate">Activate</button>
        <button type="button" role="menuitem" data-popover="move-group">Move to group</button>
        <button type="button" role="menuitem" data-popover="labels">Labels</button>
        <button type="button" role="menuitem" data-batch="duplicate">Duplicate</button>
        <button type="button" role="menuitem" data-batch="export">Export</button>
        <button type="button" role="menuitem action-bar-more-danger" data-batch="delete">Delete</button>
      </div>
    </div>
  </div>
  <button type="button" class="action-bar-clear" id="action-bar-clear" aria-label="Clear selection">×</button>
</div>

<aside class="material-overlay workspace-drawer hidden" id="store-drawer" aria-hidden="true">
  <div class="drawer-header">
    <h2 id="drawer-title">Store details</h2>
    <button type="button" class="drawer-close" id="drawer-close" aria-label="Close">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="material-overlay workspace-popover hidden" id="workspace-popover">
  <div class="popover-head" id="popover-title"></div>
  <div class="popover-body" id="popover-body"></div>
</div>

<div class="workspace-context-menu hidden" id="context-menu"></div>
<div class="material-feedback workspace-toast hidden" id="workspace-toast"></div>

<script>
  window.WORKSPACE_BOOT = {{ workspace | tojson }};
</script>
<script src="{{ url_for('static', filename='workspace.js') }}"></script>

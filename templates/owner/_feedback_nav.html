{% macro feedback_nav(store, section) %}
<nav class="fb-subnav" aria-label="{{ _('owner.feedback_sections') }}">
  <a href="{{ url_for('manage_store_insights', slug=store.slug) }}" class="fb-subnav__item">{{ _('owner.back_insights') }}</a>
  <a href="{{ url_for('manage_feedback_overview', slug=store.slug) }}" class="fb-subnav__item{% if section == 'overview' %} is-active{% endif %}">{{ _('owner.overview') }}</a>
  <a href="{{ url_for('manage_feedback_templates', slug=store.slug) }}" class="fb-subnav__item{% if section == 'templates' %} is-active{% endif %}">{{ _('owner.templates') }}</a>
  <a href="{{ url_for('manage_feedback_inbox', slug=store.slug) }}" class="fb-subnav__item{% if section == 'inbox' %} is-active{% endif %}">{{ _('owner.inbox') }}</a>
  <a href="{{ url_for('manage_feedback_analytics', slug=store.slug) }}" class="fb-subnav__item{% if section == 'analytics' %} is-active{% endif %}">{{ _('owner.analytics') }}</a>
  <a href="{{ url_for('manage_feedback_settings', slug=store.slug) }}" class="fb-subnav__item{% if section == 'settings' %} is-active{% endif %}">{{ _('bos.settings') }}</a>
</nav>
{% endmacro %}

{% macro feedback_nav(store, section) %}
<nav class="fb-subnav" aria-label="Feedback sections">
  <a href="{{ url_for('manage_feedback_overview', slug=store.slug) }}" class="fb-subnav__item{% if section == 'overview' %} is-active{% endif %}">Overview</a>
  <a href="{{ url_for('manage_feedback_templates', slug=store.slug) }}" class="fb-subnav__item{% if section == 'templates' %} is-active{% endif %}">Templates</a>
  <a href="{{ url_for('manage_feedback_inbox', slug=store.slug) }}" class="fb-subnav__item{% if section == 'inbox' %} is-active{% endif %}">Inbox</a>
  <a href="{{ url_for('manage_feedback_analytics', slug=store.slug) }}" class="fb-subnav__item{% if section == 'analytics' %} is-active{% endif %}">Analytics</a>
  <a href="{{ url_for('manage_feedback_settings', slug=store.slug) }}" class="fb-subnav__item{% if section == 'settings' %} is-active{% endif %}">Settings</a>
</nav>
{% endmacro %}

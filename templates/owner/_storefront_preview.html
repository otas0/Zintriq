{# Live customer storefront preview — owner manage / deals #}
<aside class="sf-owner-preview" aria-label="Customer preview">
  <div class="sf-owner-preview__head">
    <strong>Live preview</strong>
    <a class="sf-owner-preview__open" href="{{ url_for('store_preview', slug=store.slug) }}" target="_blank" rel="noopener">Open ↗</a>
  </div>
  <iframe class="sf-owner-preview__frame" title="Customer storefront preview"
          src="{{ url_for('store_preview', slug=store.slug) }}?view=shop" loading="lazy"></iframe>
</aside>

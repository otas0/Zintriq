<!doctype html>
<html lang="{{ html_lang|default('en') }}">
<head>
  {% include 'partials/theme_init.html' %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  {% include 'partials/favicon_links.html' %}
  <title>{{ page_title }} — Zintriq</title>
  {% if desktop_mode %}
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts/geist-sans/geist-sans.css') }}">
  {% else %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
  {% endif %}
  <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='materials.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='builder/universal-builder.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="ub-shell-body">
  {% block content %}{% endblock %}
  <div class="ub-toast" id="ub-toast" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>

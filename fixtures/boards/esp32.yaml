id: esp32
name: ESP32 DevKitC
mcuFamily: esp32
toolchain:
  compiler: g++
  flags:
    - -std=c++17
    - -Wall
    - -fsyntax-only
pins:
  LED: GPIO2
  BUTTON: GPIO0
  UART0_TX: GPIO1
  UART0_RX: GPIO3
peripherals:
  - name: uart0
    kind: uart
    pins:
      - UART0_TX
      - UART0_RX
  - name: wifi
    kind: radio
    pins: []

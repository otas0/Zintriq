<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — Zintriq</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #111; background: #fff; }
    main { max-width: 28rem; margin: 72px auto; padding: 0 24px; }
    .kicker { margin: 0 0 12px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #666; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 600; }
    p { line-height: 1.5; color: #444; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 12px; }
    button {
      height: 36px; padding: 0 14px; border: 1px solid #ccc; background: #fff;
      font: inherit; font-size: 14px; cursor: pointer;
    }
    button.primary { background: #111; border-color: #111; color: #fff; }
    #hint { min-height: 1.4em; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Zintriq Studio</p>
    <h1>Sign in to continue</h1>
    <p>Log in to sync drafts and publish to your account. Opening a local zip and editing on this computer does not need an account.</p>
    <div class="actions">
      <button type="button" class="primary" id="login">Log in</button>
      <button type="button" id="signup">Sign up</button>
    </div>
    <p id="hint"></p>
  </main>
  <script>
    const desktop = window.zintriqDesktop;
    const hint = document.getElementById("hint");
    function show(msg) { hint.textContent = msg || ""; }
    async function run(fn) {
      show("Opening the website…");
      try {
        await fn();
        show("Finish on the website. This window opens Studio when the account is synced.");
      } catch (err) {
        show(err && err.message ? err.message : "Could not open the website.");
      }
    }
    document.getElementById("login").addEventListener("click", function () {
      if (!desktop) return;
      run(function () { return desktop.login(); });
    });
    document.getElementById("signup").addEventListener("click", function () {
      if (!desktop) return;
      run(function () { return desktop.signup(); });
    });
    document.addEventListener("dragover", function (event) {
      event.preventDefault();
    });
    document.addEventListener("drop", function (event) {
      event.preventDefault();
      const files = event.dataTransfer && event.dataTransfer.files;
      const file = files && files[0];
      if (!file || !desktop) return;
      const name = String(file.name || "").toLowerCase();
      if (!name.endsWith(".zip") && !name.endsWith(".zintriq-app") && !name.endsWith(".json")) return;
      const filePath = desktop.pathForFile ? desktop.pathForFile(file) : "";
      if (filePath && desktop.openPack) desktop.openPack(filePath);
    });
  </script>
</body>
</html>

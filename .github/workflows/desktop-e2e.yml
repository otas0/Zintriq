name: Desktop e2e

# Electron smoke for typed UI (no Chromium CDN). macOS ships a usable Electron binary via desktop/npm.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - ".github/workflows/desktop-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - ".github/workflows/desktop-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  electron-smoke:
    name: playwright / electron
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install

      - name: Install Electron host deps
        working-directory: desktop
        run: npm ci

      - name: Build packages used by desktop
        run: pnpm --filter @zintriq/protocol build && pnpm --filter @zintriq/desktop build

      - name: Playwright Electron smoke
        working-directory: apps/desktop
        run: corepack pnpm exec playwright test
        env:
          CI: "true"
        continue-on-error: false

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ github.run_id }}
          path: |
            apps/desktop/test-results/**
            apps/desktop/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7

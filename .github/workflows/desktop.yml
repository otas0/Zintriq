name: Desktop

# Opt-in only: typed MVP CI is ci.yml. Avoid auto-running on main merges of apps/*.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: "${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.smoke && ' / smoke' || ' / unittest' }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            smoke: true
          - os: macos-latest
            python: "3.11"
            smoke: true
          - os: windows-latest
            python: "3.11"
            smoke: true
    env:
      electron_config_cache: ${{ github.workspace }}/.electron-cache
      ZINTRIQ_SMOKE_USER_DATA: ${{ github.workspace }}/.ci-smoke-user
      ZINTRIQ_SMOKE_TIMEOUT_MS: "300000"
      ZINTRIQ_SMOKE_COLD_MS: "12000"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        if: matrix.smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Install Python dependencies
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Unit tests
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m unittest tests.test_editor_app -v

      - name: Unit tests
        if: runner.os != 'Windows'
        run: .venv/bin/python -m unittest tests.test_editor_app -v

      - name: Install Electron deps
        if: matrix.smoke
        working-directory: desktop
        run: npm ci

      - name: Desktop smoke
        if: matrix.smoke
        working-directory: desktop
        run: npm run smoke

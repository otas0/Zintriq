name: Desktop

on:
  workflow_dispatch:
  pull_request:
  push:
    # Feature branches are covered by pull_request; avoid push+PR double runs.
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per branch so synchronize events replace in-flight PR runs.
  group: desktop-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: "${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.smoke && ' / smoke' || ' / unittest' }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            smoke: true
          - os: ubuntu-latest
            python: "3.9"
            smoke: false
          - os: macos-latest
            python: "3.11"
            smoke: true
          - os: windows-latest
            python: "3.11"
            smoke: true
    env:
      electron_config_cache: ${{ github.workspace }}/.electron-cache
      ZINTRIQ_SMOKE_USER_DATA: ${{ github.workspace }}/.ci-smoke-user
      ZINTRIQ_SMOKE_LOG_DIR: ${{ github.workspace }}/ci-logs
      ZINTRIQ_SMOKE_TOKEN_FILE: ${{ github.workspace }}/.ci-desktop-token
      ZINTRIQ_SMOKE_TIMEOUT_MS: "300000"
      # Shared runners are slower; product gate locally remains 3000ms.
      ZINTRIQ_SMOKE_COLD_MS: "12000"
      SMOKE_LOG: ${{ github.workspace }}/smoke.txt

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        if: matrix.smoke || runner.os == 'Windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Install Python dependencies
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Acceptance pack check
        if: matrix.python == '3.11'
        shell: bash
        run: |
          PY=.venv/bin/python
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; fi
          "$PY" scripts/acceptance_pack_check.py

      - name: Acceptance lint
        if: matrix.python == '3.11' && runner.os != 'Windows'
        run: |
          .venv/bin/python -m pip install -q ruff
          .venv/bin/python scripts/acceptance_lint.py

      - name: Acceptance coverage (meta ≥80%)
        if: matrix.python == '3.11' && runner.os != 'Windows'
        run: .venv/bin/python scripts/acceptance_coverage.py

      - name: Unit tests
        id: tests-win
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m unittest discover -s tests -v > unittest.txt 2>&1
          set EXITCODE=%ERRORLEVEL%
          type unittest.txt
          exit /b %EXITCODE%

      - name: Unit tests
        id: tests-unix
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          set -o pipefail
          .venv/bin/python -m unittest discover -s tests 2>&1 | tee unittest.txt

      - name: Cache Electron binaries
        if: matrix.smoke
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Linux libraries for Electron
        if: matrix.smoke && runner.os == 'Linux'
        run: |
          sudo apt-get update
          pkgs="xvfb libnss3 libgbm1 libxss1 libxtst6 libxshmfence1"
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            pkgs="$pkgs libgtk-3-0t64 libasound2t64"
          else
            pkgs="$pkgs libgtk-3-0 libasound2"
          fi
          sudo apt-get install -y $pkgs

      # npm ci keeps lifecycle scripts so Electron's postinstall can download its binary.
      - name: Install desktop npm dependencies
        if: matrix.smoke
        timeout-minutes: 10
        working-directory: desktop
        run: npm ci

      - name: Smoke
        id: smoke-linux
        if: matrix.smoke && runner.os == 'Linux'
        timeout-minutes: 15
        working-directory: desktop
        env:
          ZINTRIQ_SMOKE_XVFB: "1"
        run: |
          set -o pipefail
          xvfb-run -a npm run smoke 2>&1 | tee "$SMOKE_LOG"

      - name: Smoke
        id: smoke-mac
        if: matrix.smoke && runner.os == 'macOS'
        timeout-minutes: 15
        working-directory: desktop
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee "$SMOKE_LOG"

      - name: Smoke
        id: smoke-win
        if: matrix.smoke && runner.os == 'Windows'
        timeout-minutes: 15
        working-directory: desktop
        run: |
          npm run smoke *>&1 | Tee-Object -FilePath $env:SMOKE_LOG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject logs that contain the desktop token
        id: guard
        if: always() && (steps.tests-win.outcome == 'failure' || steps.tests-unix.outcome == 'failure' || steps.smoke-linux.outcome == 'failure' || steps.smoke-mac.outcome == 'failure' || steps.smoke-win.outcome == 'failure')
        run: python desktop/scripts/check_log_artifact.py

      - name: Upload logs
        if: always() && steps.guard.outcome == 'success' && (steps.tests-win.outcome == 'failure' || steps.tests-unix.outcome == 'failure' || steps.smoke-linux.outcome == 'failure' || steps.smoke-mac.outcome == 'failure' || steps.smoke-win.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-logs-${{ runner.os }}-py${{ matrix.python }}
          path: |
            unittest.txt
            smoke.txt
            ci-logs/
          if-no-files-found: ignore

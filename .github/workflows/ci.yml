name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tiny probe: if THIS job also fails with empty steps, treat the run as billing/quota
  # (not a typed-MVP regression). Local: scripts/classify-ci-run.sh <run_id>
  runners-ok:
    name: runners-ok (billing probe)
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runners accepted this workflow
        run: |
          {
            echo "## CI failure mode"
            echo
            echo "| Signal | Meaning |"
            echo "|---|---|"
            echo "| This job **green** + later jobs fail mid-step | **REAL** test/lint/build failure |"
            echo "| This job **fails in ~seconds with empty steps** | **BILLING / spending-limit** — not a code regression |"
            echo "| \`required\` skipped and all matrix jobs empty-step | Same: fix Billing & plans, then re-run |"
            echo
            echo "Classifier: \`scripts/classify-ci-run.sh <run_id>\` → \`BILLING_OR_QUOTA\` vs \`REAL_FAILURE\`."
            echo
            echo "**Do not cut new \`-release\` tags** while empty-step failures dominate."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "runners accepted workflow; later empty-step siblings ⇒ billing; mid-step red ⇒ real"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      # Packaging SUMS coverage (missing/extra/digest) — also on every PR via this job.
      - run: pnpm test:sha256sums
      # Offline truncated-cache → re-get fixture (no GitHub / Azure required).
      - run: pnpm test:size-guard

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build

  # Visible on every PR. continue-on-error keeps a missing/broken g++ path from blocking merge.
  integration:
    name: integration (g++ / non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: pnpm install
      - run: pnpm --filter @zintriq/protocol build
      - run: pnpm --filter @zintriq/build-service test:integration

  # Single green gate for branch protection when the host plan allows required checks.
  # Prefer requiring: lint, typecheck, test, build (not integration / pack / smoke).
  # if: always() so we can write STEP_SUMMARY classifying billing vs real when needs fail.
  required:
    name: required (lint typecheck test build)
    runs-on: ubuntu-latest
    if: always()
    needs: [runners-ok, lint, typecheck, test, build]
    steps:
      - name: Classify needs + gate
        env:
          R_OK: ${{ needs.runners-ok.result }}
          R_LINT: ${{ needs.lint.result }}
          R_TC: ${{ needs.typecheck.result }}
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          {
            echo "## required gate"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| runners-ok | \`$R_OK\` |"
            echo "| lint | \`$R_LINT\` |"
            echo "| typecheck | \`$R_TC\` |"
            echo "| test | \`$R_TEST\` |"
            echo "| build | \`$R_BUILD\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$R_OK" != "success" ] && [ "$R_LINT" != "success" ] && [ "$R_TC" != "success" ] && [ "$R_TEST" != "success" ] && [ "$R_BUILD" != "success" ]; then
            {
              echo "**VERDICT: BILLING_OR_QUOTA (likely)** — \`runners-ok\` and all typed jobs failed before useful work."
              echo "Fix GitHub **Billing & plans** / Actions spending limit, then re-run."
              echo "Local classifier: \`scripts/classify-ci-run.sh ${{ github.run_id }}\`"
              echo "Do **not** cut a new \`-release\` tag until jobs show real steps."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=BILLING_OR_QUOTA::Empty-step / runners-ok failure — not a typed MVP regression. Fix Actions billing, then re-run."
            exit 1
          fi

          if [ "$R_LINT" = "success" ] && [ "$R_TC" = "success" ] && [ "$R_TEST" = "success" ] && [ "$R_BUILD" = "success" ]; then
            echo "typed MVP required checks passed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "**VERDICT: REAL_FAILURE** — at least one of lint/typecheck/test/build failed after runners accepted work."
            echo "Inspect the red job logs (steps are non-empty). \`runners-ok\` was \`$R_OK\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=REAL_FAILURE::A required typed job failed with real steps — fix the regression, not billing."
          exit 1

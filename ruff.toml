# Product-body lint gate. Scoped to meta core, desktop Python, and acceptance tests.
target-version = "py39"
line-length = 120

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "UP",  # pyupgrade
  "B",   # bugbear
  "W",   # warnings
]
ignore = [
  "E501",  # line length handled by formatter preference elsewhere
  "B008",  # function calls in defaults used by Flask patterns
  "UP006", # keep typing.List etc. where py39 compat matters
  "UP007",
  "UP035",
  "UP045", # Optional[] kept for readability in desktop host
]

[lint.per-file-ignores]
"tests/*" = ["B018", "B017"]
"scripts/*" = ["T201"]
"meta/description/types.py" = ["F821"]

[lint.isort]
known-first-party = ["meta", "desktop"]

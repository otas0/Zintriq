<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zintriq</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #fff;
      display: grid; place-items: center; min-height: 100vh; }
    .box { text-align: center; padding: 24px; }
    .mark { width: 64px; height: 64px; border-radius: 16px; background: #fff; color: #111;
      display: grid; place-items: center; font-size: 32px; font-weight: 700; margin: 0 auto 16px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">B</div>
    <p>Opening Zintriq…</p>
    <p style="opacity:.7;font-size:14px">If this screen stays, set MOBILE_SERVER_URL in .env.local and run <code>npm run sync</code>.</p>
  </div>
  <script>
    // Fallback when not using server.url — production apps load /app from Flask directly.
    window.location.replace("/app/store");
  </script>
</body>
</html>
